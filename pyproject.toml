[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "complete-bipartite-drawing-census"
version = "0.1.0"
description = "Reproducible enumeration of good drawings of small complete bipartite graphs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
bipartite-drawing-census = "graph_drawings.cli:main"
bipartite-census-check = "graph_drawings.check:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
graph_drawings = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
